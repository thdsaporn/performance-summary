.topbar{

  padding:22px 0 0;
  margin-bottom:24px;
}
.topbar-inner{max-width:1180px;margin:0 auto;padding:0 20px 18px;}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;}
.brand-mark{
  font-family:'Chonburi',serif;
  font-size:15px;
  letter-spacing:0.14em;
  color:var(--gold-light);
  border:1px solid rgba(232,200,119,0.5);
  padding:3px 10px;
  border-radius:999px;
}
.brand h1{
  font-size:26px;
  font-weight:700;
  margin:0;
  letter-spacing:0.01em;
}
.brand p{margin:4px 0 0;color:#c9d5e2;font-size:14.5px;}
.tabs{

  overflow-x:auto;
  padding-bottom:2px;
}
.tab-btn{
  appearance:none;border:none;cursor:pointer;
  background:rgba(255,255,255,0.08);
  color:#dde6ee;
  font-family:inherit;font-size:14.5px;font-weight:600;
  padding:10px 16px;
  border-radius:8px 8px 0 0;
  white-space:nowrap;
  transition:background .15s ease, color .15s ease;
}
.tab-btn:hover{background:rgba(255,255,255,0.16);}
.tab-btn.active{background:var(--cream);color:var(--navy-deep);}

.panel{display:none;}
.panel.active{display:block;}

.card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:22px;
  margin-bottom:20px;
}
.card h2{
  font-size:18px;margin:0 0 4px;color:var(--navy-deep);
  display:flex;align-items:center;gap:8px;
}
.card .sub{color:var(--ink-soft);font-size:14px;margin:0 0 16px;}

.field-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field.wide{grid-column:1/-1;}
.field label{font-size:13px;font-weight:600;color:var(--ink-soft);}
input,select,textarea{
  font-family:inherit;font-size:15px;
  border:1.5px solid var(--line);border-radius:7px;
  padding:8px 10px;background:#fff;color:var(--ink);
  width:100%;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--navy);outline-offset:1px;border-color:var(--navy);}
.btn{
  appearance:none;border:none;cursor:pointer;font-family:inherit;
  font-weight:600;font-size:14.5px;border-radius:8px;padding:10px 18px;
  transition:transform .08s ease, box-shadow .15s ease, background .15s ease;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--navy);color:#fff;}
.btn-primary:hover{background:var(--navy-deep);}
.btn-gold{background:var(--gold);color:#fff;}
.btn-gold:hover{background:#a3761f;}
.btn-ghost{background:transparent;color:var(--navy);border:1.5px solid var(--line);}
.btn-ghost:hover{border-color:var(--navy);}
.btn-danger{background:#fbe9e5;color:var(--red);}
.btn-danger:hover{background:#f6d5cc;}
.btn-sm{padding:5px 10px;font-size:13px;border-radius:6px;}
.row-actions{display:flex;gap:6px;}

table.data-table{width:100%;border-collapse:collapse;font-size:14.5px;}
table.data-table th{
  background:var(--navy);color:#fff;text-align:left;
  padding:9px 10px;font-weight:600;font-size:13.5px;
  position:sticky;top:0;
}
table.data-table td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
table.data-table tbody tr:hover{background:#f2f6fa;}
.table-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--line);max-height:520px;overflow-y:auto;}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:600;}
.badge-theory{background:#e4ecf7;color:var(--navy);}
.badge-practice{background:#fdecd9;color:#9a5a12;}
.badge-discussion{background:#e9e4f6;color:#5b3fa8;}
.badge-extra{background:#eceef1;color:#5b6b7a;}
.empty-state{padding:40px 20px;text-align:center;color:var(--ink-soft);}
.empty-state .glyph{font-size:34px;display:block;margin-bottom:8px;}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px;}
.stat-box{background:#f2f6fa;border-radius:8px;padding:14px 16px;}
.stat-box .n{font-size:24px;font-weight:700;color:var(--navy-deep);}
.stat-box .l{font-size:12.5px;color:var(--ink-soft);font-weight:600;}

.searchbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px;}
.searchbar .field{flex:1;min-width:220px;}

.progress-track{background:#e6ebef;border-radius:99px;height:8px;overflow:hidden;}
.progress-fill{height:100%;background:var(--green);}
.progress-fill.over{background:var(--red);}

.month-nav{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.month-nav select{width:auto;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.cal-head{background:var(--navy);color:#fff;text-align:center;padding:8px 4px;font-size:13px;font-weight:600;}
.cal-cell{background:#fff;min-height:88px;padding:6px 8px;font-size:12.5px;}
.cal-cell.empty{background:#f7f8fa;}
.cal-cell .d{font-weight:700;font-size:14px;color:var(--navy-deep);}
.cal-cell .hrs{color:var(--ink-soft);margin-top:4px;}
.cal-cell .hrs b{color:var(--navy);}

.footer-note{color:var(--ink-soft);font-size:13px;text-align:center;margin-top:30px;}

@media (max-width:640px){

#printPreviewWrap{
  background:#e9edf1;padding:24px;border-radius:10px;

}

table.print-table thead{display:table-header-group;}

}
table.print-table td{border:1px solid #333;padding:3px 6px;vertical-align:top;overflow-wrap:anywhere;}

table.print-table .tname.t-long{font-size:13pt;line-height:1.2;}

table.print-table tr{break-inside:avoid;page-break-inside:avoid;}
.print-note{font-size:12pt;margin-top:6px;}
.sig-wrap{display:flex;gap:24px;margin-top:12px;}
.sig-block{flex:1;min-width:0;}
.sig-title{text-align:center;font-weight:700;margin-bottom:4px;font-size:14pt;}
.sig-line{text-align:center;margin:2px 0;font-size:14pt;line-height:1.2;}
.sig-filled{font-weight:600;}

@media print{
  body{background:#fff;}
  .topbar, .app > .card, .app > #printPreviewWrap ~ *, .footer-note{display:none !important;}
  body *{visibility:hidden;}

  .sheet{box-shadow:none;max-width:100%;padding:0;}
  #printPreviewWrap{padding:0;background:#fff;}
  @page{size:A4;margin:12mm;}
}

let CURRICULA = [];          // ทุกหลักสูตรที่โหลดมาจาก SETTINGS
let activeCurId = 'nst2567'; // รหัสหลักสูตรที่ใช้งานอยู่

function activeCurriculum(){
  return CURRICULA.find(c=>c.id===activeCurId) || CURRICULA[0] || DEFAULT_CURRICULA[0];
}
function recomputeCurriculum(){
  const cur = activeCurriculum();
  CURRICULUM = cur.subjects.map(s => ({...s, total: (s.theory||0) + (s.practice||0) + (s.discussion||0)}));
  CURRICULUM_MAIN = CURRICULUM.filter(c => !c.extra); // วิชาหลัก
  REQUIRED_TOTAL = CURRICULUM_MAIN.reduce((s,c)=>s+c.total,0);
}
// ประเภทคาบ: ทฤษฎี / ปฏิบัติ / อภิปราย
function typeAbbr(type){ return type==='ทฤษฎี' ? 'ท' : (type==='ปฏิบัติ' ? 'ป' : 'อ'); }

const THAI_DAYS = ["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"];
const THAI_MONTHS = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
const THAI_MONTHS_ABBR = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];

// ============================================================
function pad2(n){ return String(n).padStart(2,'0'); }
function uid(){ return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function parseYMD(s){ // 'YYYY-MM-DD' -> Date (local, noon to dodge TZ issues)
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d, 12, 0, 0);
}
function toYMD(dt){
  return dt.getFullYear() + '-' + pad2(dt.getMonth()+1) + '-' + pad2(dt.getDate());
}
function thaiWeekday(ymd){ return THAI_DAYS[parseYMD(ymd).getDay()]; }
function buddhistYear(ymd){ return parseYMD(ymd).getFullYear() + 543; }
function thaiDateShort(ymd){
  const d = parseYMD(ymd);
  return d.getDate() + ' ' + THAI_MONTHS_ABBR[d.getMonth()] + ' ' + (d.getFullYear()+543-2500);
}
function thaiDateFull(ymd){
  const d = parseYMD(ymd);
  return thaiWeekday(ymd) + ' ' + d.getDate() + ' ' + THAI_MONTHS_ABBR[d.getMonth()] + ' ' + (buddhistYear(ymd) % 100);
}
// วันที่แก้ไขไฟล์ล่าสุด (อ่านจาก document.lastModified — อัปเดตเองทุกครั้งที่แก้ไฟล์และบันทึก)
function fileModifiedDateText(){
  try{
    const d = new Date(document.lastModified);
    if(isNaN(d.getTime())) throw new Error('no lastModified');
    return d.getDate() + ' ' + THAI_MONTHS[d.getMonth()] + ' ' + (d.getFullYear()+543);
  }catch(e){
    const now = new Date();
    return now.getDate() + ' ' + THAI_MONTHS[now.getMonth()] + ' ' + (now.getFullYear()+543);
  }
}
function hoursBetween(start,end){
  if(!start || !end) return 0;
  const [sh,sm] = start.split(':').map(Number);
  const [eh,em] = end.split(':').map(Number);
  let mins = (eh*60+em) - (sh*60+sm);
  if(mins < 0) mins = 0;
  return Math.round((mins/60)*100)/100;
}
function timesOverlap(startA,endA,startB,endB){
  return startA < endB && startB < endA;
}
function findOverlap(date, start, end, excludeId){
  return ENTRIES.find(e =>
    e.date === date &&
    e.id !== excludeId &&
    timesOverlap(start, end, e.start, e.end)
  ) || null;
}
function fmtHours(h){
  if(h === 0) return '0';
  return (Math.round(h*100)/100).toString();
}
function subjectByCode(code){ return CURRICULUM.find(c=>c.code===code); }
function subjectByName(name){ return CURRICULUM.find(c=>c.name===name); }
// กฎชื่อวิทยากร: คาบทฤษฎี = ไม่ลงท้าย "และคณะ" ส่วนคาบอภิปราย/ปฏิบัติ = ให้มี "และคณะ" (ถ้ายังไม่มีคำบอกคณะอยู่แล้ว เช่น คณะครูฝึก, ครูฝึก/จนท.)
function adjustTeacherForType(type, teacher){
  let t = (teacher || '').trim().replace(/\s+/g, ' ');
  if(!t) return t;
  if(type === 'ทฤษฎี'){
    return t.replace(/\s*และคณะ\s*$/, '');
  }
  if(!/คณะ|และคณะ|\//.test(t)){
    return t + ' และคณะ';
  }
  return t;
}

function normalizeSpace(s){
  return (s || '').replace(/\s+/g, ' ').trim();
}
function escapeHtml(s){
  if(s==null) return '';
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(s){
  return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');
}

function devSchedule(d, overrides){
  overrides = overrides || {};
  const monPm = overrides.monPm || [
    ['13:00','14:00','การเขียนรายงานในหน้าที่ตำรวจ','บร.104'],

  ];

    ['13:00','14:00','นโยบายและแนวคิดทฤษฎีการป้องกันปราบปรามอาชญากรรม'],
    ['14:00','16:00','ยุทธวิธีตำรวจและแนวทางการปฏิบัติงานป้องกันและปราบปรามอาชญากรรม'],
  ];

  await saveEntries();
  await storageSetRaw(vKey, String(DEFAULT_ENTRIES_VERSION));
}

// Reads from window.storage (Claude artifact platform) when available, otherwise/also
// falls back to the browser's own localStorage so data survives refreshes even when
// this file is opened directly as a downloaded .html file outside claude.ai.
async function storageGetRaw(key){
  let claudeValue = null, claudeFound = false;
  if(hasClaudeStorage){
    try{ const r = await window.storage.get(key, false); claudeValue = r.value; claudeFound = true; }
    catch(e){ /* key not found or platform storage unavailable */ }
  }
  let localValue = null;
  try{ localValue = localStorage.getItem(key); }catch(e){ /* localStorage blocked */ }
  if(claudeFound) return claudeValue;
  return localValue;
}
async function storageSetRaw(key, value){
  let ok = false;
  if(hasClaudeStorage){
    try{ await window.storage.set(key, value, false); ok = true; }
    catch(e){ console.error('window.storage.set failed', e); }
  }
  try{ localStorage.setItem(key, value); ok = true; }
  catch(e){ console.error('localStorage.setItem failed', e); }
  return ok;
}

async function loadAll(){
  // โหลด settings ก่อน (เพื่อรู้ว่าหลักสูตรใดกำลังใช้งานอยู่)
  try{
    const raw2 = await storageGetRaw(SETTINGS_KEY);
    if(raw2) SETTINGS = Object.assign(SETTINGS, JSON.parse(raw2));
  }catch(e){ /* keep defaults */ }
  const curriculaSynced = await ensureSettingsShape();
  if(curriculaSynced) await saveSettings(); // บันทึกหลักสูตรเวอร์ชันใหม่ทันที (กันไม่พบวิชา)
  // ย้ายข้อมูลคาบของ นสต.2567 จากคีย์เดิม (เวอร์ชันเก่า) ไปยังคีย์ใหม่ครั้งเดียว
  try{
    const legacyRaw = await storageGetRaw(LEGACY_STORAGE_KEY);
    const currentRaw = await storageGetRaw(entriesKey());
    if(legacyRaw && !currentRaw) await storageSetRaw(entriesKey(), legacyRaw);
  }catch(e){ /* ignore */ }
  try{
    const raw = await storageGetRaw(entriesKey());
    ENTRIES = raw ? JSON.parse(raw) : [];
  }catch(e){ ENTRIES = []; }
  await seedDefaultEntriesIfEmpty();
}

// เตรียมโครงสร้าง settings ให้ครบ + ดึงผู้ตรวจ/ผู้อนุมัติที่เคยกรอกไว้เดิมเข้าไปในรายชื่อผู้ลงนามอัตโนมัติ
// คืนค่า true ถ้ามีการซิงก์หลักสูตรเริ่มต้นตามไฟล์ (เพื่อให้ผู้เรียกบันทึก settings)
async function ensureSettingsShape(){
  let curriculaSynced = false;
  if(!Array.isArray(SETTINGS.signers)) SETTINGS.signers = [];
  for(const [rk,nm,ps] of [['inspectorRank','inspectorName','inspectorPosition'],['approverRank','approverName','approverPosition']]){
    if(SETTINGS[nm] && !SETTINGS.signers.some(s=>s.name===SETTINGS[nm])){
      SETTINGS.signers.push({ rank: SETTINGS[rk], name: SETTINGS[nm], position: SETTINGS[ps] });
    }
  }
  // ---- หลักสูตร: เตรียมโครงสร้าง + seed ค่าเริ่มต้น นสต. ถ้ายังไม่มี ----
  if(!Array.isArray(SETTINGS.curricula) || SETTINGS.curricula.length===0){
    SETTINGS.curricula = DEFAULT_CURRICULA.map(c=>({
      id:c.id, name:c.name, locked:c.locked, printHeader2:c.printHeader2, header2:c.header2,
      printHeader3:c.printHeader3, header3:c.header3,
      subjects:c.subjects.map(s=>({...s}))
    }));
  }
  // หลักสูตรมาตรฐาน นสต. — บังคับชื่อและล็อกไม่ให้แก้ไข/ลบวิชาเสมอ (กันแก้ผิดโดยไม่ตั้งใจ)
  const builtinCur = SETTINGS.curricula.find(c=>c.id==='nst2567');
  if(builtinCur){
    builtinCur.name = DEFAULT_CURRICULA[0].name;
    builtinCur.locked = true;
  }
  // หลักสูตรเริ่มต้น: เพิ่มให้อัตโนมัติถ้ายังไม่มี + ซิงก์รายวิชาให้ตรงกับไฟล์เมื่อไฟล์มีเวอร์ชันใหม่กว่า
  // (กันปัญหาข้อมูลหลักสูตรเก่าค้างจากไฟล์รุ่นก่อน เช่น กดแก้ไขคาบแล้วขึ้น "ไม่พบวิชา")
  for(const def of DEFAULT_CURRICULA){
    const existing = SETTINGS.curricula.find(c=>c.id===def.id);
    const vKey = 'cur-curriculum-version-' + def.id;
    let savedVer = 0;
    try{ savedVer = Number(await storageGetRaw(vKey)) || 0; }catch(e){}
    if(!existing){
      SETTINGS.curricula.push({
        id:def.id, name:def.name, locked:def.locked,
        printHeader2:def.printHeader2, header2:def.header2,
        printHeader3:def.printHeader3, header3:def.header3,
        subjects:def.subjects.map(s=>({...s}))
      });
      await storageSetRaw(vKey, String(DEFAULT_CURRICULA_VERSION));
      curriculaSynced = true;
    } else if(savedVer < DEFAULT_CURRICULA_VERSION){
      // ข้อมูลหลักสูตรเก่ากว่าไฟล์ → อัปเดตตามไฟล์ (เฉพาะหลักสูตรเริ่มต้น; หลักสูตรที่ผู้ใช้สร้างเองไม่เข้าเงื่อนไขนี้)
      existing.name = def.name;
      existing.locked = def.locked;
      existing.printHeader2 = def.printHeader2;
      existing.header2 = def.header2;
      existing.printHeader3 = def.printHeader3;
      existing.header3 = def.header3;
      existing.subjects = def.subjects.map(s=>({...s}));
      await storageSetRaw(vKey, String(DEFAULT_CURRICULA_VERSION));
      curriculaSynced = true;
      if(SETTINGS.activeCurId === def.id){
        // หลักสูตรที่กำลังใช้อยู่ → อัปเดตค่าหน้าพิมพ์ (บรรทัดที่ 2/3) ให้ตรงไฟล์ทันที
        SETTINGS.orgLine2 = def.header2 || def.printHeader2 || SETTINGS.orgLine2;
        SETTINGS.orgLine3 = def.header3 || def.printHeader3 || SETTINGS.orgLine3;
      }
    }
  }
  if(typeof SETTINGS.activeCurId !== 'string' || !SETTINGS.curricula.some(c=>c.id===SETTINGS.activeCurId)){
    SETTINGS.activeCurId = SETTINGS.curricula[0].id;
  }
  activeCurId = SETTINGS.activeCurId;
  CURRICULA = SETTINGS.curricula;
  recomputeCurriculum();
  return curriculaSynced;
}
async function saveEntries(){
  lastSaveOk = await storageSetRaw(entriesKey(), JSON.stringify(ENTRIES));
  updateSaveIndicator();
  return lastSaveOk;
}
async function saveSettings(){
  lastSaveOk = await storageSetRaw(SETTINGS_KEY, JSON.stringify(SETTINGS));
  updateSaveIndicator();
  return lastSaveOk;
}
function updateSaveIndicator(){
  const el = document.getElementById('saveIndicator');
  if(!el) return;
  const now = new Date();
  const stamp = pad2(now.getHours()) + ':' + pad2(now.getMinutes()) + ':' + pad2(now.getSeconds());
  el.textContent = lastSaveOk ? `✓ บันทึกอัตโนมัติแล้ว (${stamp})` : `⚠️ บันทึกไม่สำเร็จ — กรุณาดาวน์โหลดไฟล์สำรองไว้`;
  el.style.color = lastSaveOk ? '#2f7d5a' : '#b3432b';
}


function uniqueTeachers(){
  return [...new Set(ENTRIES.map(e=>e.teacher).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'th'));
}
function uniquePlaces(){
  return [...new Set(ENTRIES.map(e=>e.place).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'th'));
}

    await saveEntries();

  });

function monthOptionsFromEntries(){
  const months = [...new Set(ENTRIES.map(e => e.date ? e.date.slice(0,7) : null).filter(Boolean))].sort();
  return months.map(m => {
    const [y,mo] = m.split('-').map(Number);
    const label = THAI_MONTHS[mo-1] + ' ' + (y+543);
    return `<option value="${m}" ${entryFilterMonth===m?'selected':''}>${label}</option>`;
  }).join('');
}

              <td>${escapeHtml(e.place||'-')}</td>

                <div class="row-actions">
                  <button class="btn btn-ghost btn-sm" onclick="startEdit('${e.id}')">แก้ไข</button>

                </div>

  `;
}

async function exportData(){
  const payload = { exportedAt: new Date().toISOString(), entries: ENTRIES, settings: SETTINGS };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = toYMD(new Date());
  a.href = url;
  a.download = `ตารางฝึกอบรม-สำรองข้อมูล-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function importData(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    try{
      const data = JSON.parse(ev.target.result);
      if(!Array.isArray(data.entries)) throw new Error('รูปแบบไฟล์ไม่ถูกต้อง');
      const replace = confirm(`พบ ${data.entries.length} คาบเรียนในไฟล์\n\nกด "ตกลง" เพื่อ "แทนที่" ข้อมูลทั้งหมดที่มีอยู่\nกด "ยกเลิก" เพื่อ "รวม" เข้ากับข้อมูลเดิม (ไม่ลบของเดิม)`);
      if(replace){
        ENTRIES = data.entries;
      } else {
        const existingIds = new Set(ENTRIES.map(e=>e.id));
        data.entries.forEach(e => { if(!existingIds.has(e.id)) ENTRIES.push(e); else ENTRIES.push({...e, id: uid()}); });
      }
      if(data.settings) SETTINGS = Object.assign(SETTINGS, data.settings);
      await ensureSettingsShape();
      await saveEntries();
      await saveSettings();
      alert('นำเข้าข้อมูลสำเร็จ');
      renderApp();
    }catch(err){
      alert('ไม่สามารถอ่านไฟล์นี้ได้: ' + err.message);
    }
  };
  reader.readAsText(file);
}

function startEdit(id){
  editingId = id;
  renderApp();
  window.scrollTo({top:0, behavior:'smooth'});
}
async function deleteEntry(id){
  if(!confirm('ต้องการลบคาบเรียนนี้หรือไม่?')) return;
  ENTRIES = ENTRIES.filter(e=>e.id!==id);
  await saveEntries();
  renderApp();
}

function clampYear(y){
  if(!Number.isFinite(y)) return today.getFullYear()+543;
  return Math.min(2650, Math.max(2500, Math.round(y)));
}

  SETTINGS.printOnlyWithData = document.getElementById('pm_onlydata').checked;
  SETTINGS.printFrom = document.getElementById('pm_from').value;
  SETTINGS.printTo = document.getElementById('pm_to').value;

  SETTINGS.orgLine2 = document.getElementById('pm_org2').value;

// ชื่อวิทยากร: ใช้ 16pt เป็นหลัก — ย่อเฉพาะชื่อที่ยาวจนเกินพื้นที่ 2 บรรทัด (วัดความกว้างจริง ไม่ใช้นับตัวอักษร)
// คอลัมน์วิทยากร = 20% ของกระดาษ A4 (~750px ลบ padding 44px) ลบ padding เซลล์ = ~138px ใช้ได้
const TEACHER_COL_W_PX = 138; // คอลัมน์วิทยากร 20% ของกระดาษ A4 ลบ padding เซลล์
const PLACE_COL_W_PX = 69;    // คอลัมน์สถานที่ 12% ของกระดาษ A4 ลบ padding เซลล์
const _measureCtx = (typeof document !== 'undefined') ? document.createElement('canvas').getContext('2d') : null;
function textWidthPx(text, pt){
  const s = String(text == null ? '' : text);
  if(!_measureCtx) return s.length * pt * 0.5; // fallback: ประมาณคร่าว ๆ
  try{
    _measureCtx.font = pt + "pt 'TH SarabunIT๙','Sarabun',sans-serif";
    return _measureCtx.measureText(s).width;
  }catch(e){ return s.length * pt * 0.5; }
}
function teacherNameHtml(name){
  const n = name || '';
  if(!n) return '';
  const twoLinesPx = TEACHER_COL_W_PX * 2;
  let cls = '';
  if(textWidthPx(n, 16) > twoLinesPx){          // เกิน 2 บรรทัดที่ 16pt → ลอง 13pt
    if(textWidthPx(n, 13) > twoLinesPx) cls = 't-xlong'; // ยังเกิน → 10pt
    else cls = 't-long';
  }
  return `<span class="tname ${cls}">${escapeHtml(n)}</span>`;
}
// สถานที่: ปรับขนาดฟอนต์เหมือนวิทยากร แต่ประมาณจำนวนบรรทัดจริง (แบ่งตามช่องว่าง + ตัดกลางคำได้)
// เพราะข้อความสถานที่มักเป็นคำยาวต่อกัน ไม่มีช่องว่างให้พับหลายที่
function placeLinesAt(place, pt){
  let lines = 0;
  for(const tok of String(place||'').split(/\s+/)){
    if(!tok) continue;
    lines += Math.max(1, Math.ceil(textWidthPx(tok, pt) / PLACE_COL_W_PX));
  }
  return lines;
}
function placeNameHtml(place){
  const n = place || '';
  if(!n) return '';
  let cls = '';
  if(placeLinesAt(n, 16) > 2){          // เกิน 2 บรรทัดที่ 16pt → ลอง 13pt
    if(placeLinesAt(n, 13) > 2) cls = 't-xlong'; // ยังเกิน → 10pt
    else cls = 't-long';
  }
  return `<span class="tname ${cls}">${escapeHtml(n)}</span>`;
}

// บล็อกลายเซ็น: เส้นประให้เซ็นมือเองหลังพิมพ์ (กรอกยศ/ชื่อ/ตำแหน่งได้ที่หน้าตารางพิมพ์)
function sigBlock(title, rank, name, position){
  return `
    <div class="sig-block">
      <div class="sig-title">${title}</div>
      <div class="sig-line">&nbsp;</div>
      <div class="sig-line ${rank?'sig-filled':''}">${rank ? escapeHtml(rank)+' ' : ''}<span style="color:#ffffff;">....................................................</span></div>
      <div class="sig-line ${name?'sig-filled':''}">( ${escapeHtml(name) || '....................................................'} )</div>
      <div class="sig-line ${position?'sig-filled':''}">${escapeHtml(position) || 'ตำแหน่ง ....................................................'}</div>
    </div>`;
}

function buildPrintTableHtml(yearCE, month1to12, nDays){
  const monthEntries = ENTRIES.filter(e=>{
    if(!e.date) return false;
    const d = parseYMD(e.date);
    return d.getFullYear()===yearCE && (d.getMonth()+1)===month1to12;
  });

  // ช่วงวันที่ที่ต้องการพิมพ์ (ถ้ากำหนด) — จำกัดไว้ในเดือนที่เลือก ใช้เมื่อต้องพิมพ์เฉพาะบางวัน
  let dayStart = 1, dayEnd = nDays;
  if(SETTINGS.printFrom){
    const f = parseYMD(SETTINGS.printFrom);
    if(f.getFullYear()===yearCE && f.getMonth()+1===month1to12 && f.getDate()>=1 && f.getDate()<=nDays) dayStart = f.getDate();
  }
  if(SETTINGS.printTo){
    const t = parseYMD(SETTINGS.printTo);
    if(t.getFullYear()===yearCE && t.getMonth()+1===month1to12 && t.getDate()>=1 && t.getDate()<=nDays) dayEnd = t.getDate();
  }
  if(dayStart > dayEnd){ dayStart = 1; dayEnd = nDays; }

  let bodyRows = '';
  for(let day=dayStart; day<=dayEnd; day++){
    const ymd = yearCE + '-' + pad2(month1to12) + '-' + pad2(day);
    const sessions = monthEntries.filter(e=>e.date===ymd).sort((a,b)=>a.start.localeCompare(b.start));
    const dayLabel = thaiWeekday(ymd) + '<br>' + day + ' ' + THAI_MONTHS_ABBR[month1to12-1] + ' ' + ((yearCE+543)%100);
    if(sessions.length === 0){
      if(SETTINGS.printOnlyWithData) continue; // ซ่อนวันว่าง
      bodyRows += `<tr>
        <td class="day-cell">${dayLabel}</td>
        <td class="time-cell"></td><td class="time-cell"></td><td></td><td></td><td></td>
      </tr>`;
    } else {
      sessions.forEach((s, i) => {
        bodyRows += `<tr>
          ${i===0 ? `<td class="day-cell" rowspan="${sessions.length}">${dayLabel}</td>` : ''}
          <td class="time-cell">${s.start}</td>
          <td class="time-cell">${s.end}</td>
          <td>${buildSubjectDisplay(s)}</td>
          <td class="place-cell">${placeNameHtml(s.place)}</td>
          <td class="teacher-cell">${teacherNameHtml(s.teacher)}</td>
        </tr>`;
      });
    }
  }

  return `
    <h1 class="doc-title">ตารางฝึกอบรม</h1>
    <div class="org-line">${escapeHtml(SETTINGS.orgLine1)}</div>
    <div class="org-line">${escapeHtml(SETTINGS.orgLine2)}</div>
    <div class="org-line">${escapeHtml(SETTINGS.orgLine3)}</div>
    <table class="print-table">
      <thead><tr>
        <th style="width:13%;">วัน เดือน ปี</th>
        <th style="width:9%;">เวลาเริ่ม</th>
        <th style="width:9%;">เวลาสิ้นสุด</th>
        <th style="width:37%;">วิชา / กิจกรรม</th>
        <th style="width:12%;">สถานที่</th>
        <th style="width:20%;">วิทยากร</th>
      </tr></thead>
      <tbody>${bodyRows}</tbody>
    </table>
    <div class="print-note">หมายเหตุ ๑. ตารางการฝึกอบรมนี้ อาจเปลี่ยนแปลงได้ตามความเหมาะสม</div>
    <div class="sig-wrap">
      ${sigBlock('ตรวจแล้วถูกต้อง', SETTINGS.inspectorRank, SETTINGS.inspectorName, SETTINGS.inspectorPosition)}
      ${sigBlock('อนุมัติให้ใช้ทำการฝึกได้', SETTINGS.approverRank, SETTINGS.approverName, SETTINGS.approverPosition)}
    </div>
  `;
}

function renderSummaryPanel(el){
  const rows = CURRICULUM_MAIN.map(c => {
    const sessions = ENTRIES.filter(e=>e.subjectCode===c.code);
    const theoryDone = sessions.filter(e=>e.type==='ทฤษฎี').reduce((s,e)=>s+e.hours,0);
    const practiceDone = sessions.filter(e=>e.type==='ปฏิบัติ').reduce((s,e)=>s+e.hours,0);
    const discussionDone = sessions.filter(e=>e.type==='อภิปราย').reduce((s,e)=>s+e.hours,0);
    const totalDone = theoryDone + practiceDone + discussionDone;
    const pct = c.total ? Math.round((totalDone/c.total)*100) : 0;
    return {...c, sessions:sessions.length, theoryDone, practiceDone, totalDone, pct};
  });
  const grandTotalDone = rows.reduce((s,r)=>s+r.totalDone,0);
  const grandPct = REQUIRED_TOTAL ? Math.round((grandTotalDone/REQUIRED_TOTAL)*100) : 0;

  el.innerHTML = `
    <div class="card">
      <h2>📊 สรุปชั่วโมงตามวิชา</h2>
      <p class="sub">เทียบชั่วโมงที่สอนไปแล้วกับชั่วโมงตามหลักสูตร ${escapeHtml(activeCurriculum().name)} (วิชาหลัก ${REQUIRED_TOTAL} ชม. / ${CURRICULUM_MAIN.length} วิชา)</p>
      <div class="stat-grid">
        <div class="stat-box"><div class="n">${fmtHours(grandTotalDone)} / ${REQUIRED_TOTAL}</div><div class="l">ชั่วโมงรวมที่สอนแล้ว</div></div>
        <div class="stat-box"><div class="n">${grandPct}%</div><div class="l">ความคืบหน้ารวม</div></div>
        <div class="stat-box"><div class="n">${ENTRIES.length}</div><div class="l">จำนวนคาบที่บันทึกทั้งหมด</div></div>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr>
            <th>รหัสวิชา</th><th>ชื่อวิชา</th><th>ทฤษฎี</th><th>ปฏิบัติ</th><th>อภิปราย</th><th>รวม (หลักสูตร)</th>
            <th>สอนแล้ว</th><th>คงเหลือ</th><th>ครั้ง</th><th style="width:140px;">ความคืบหน้า</th>
          </tr></thead>
          <tbody>
            ${rows.map(r => `
              <tr>
                <td>${r.code}</td>
                <td>${escapeHtml(r.name)}</td>
                <td>${r.theory}</td>
                <td>${r.practice}</td>
                <td>${r.discussion||0}</td>
                <td>${r.total}</td>
                <td>${fmtHours(r.totalDone)}</td>
                <td style="color:${r.totalDone>r.total?'#b3432b':'inherit'};">${fmtHours(r.total-r.totalDone)}</td>
                <td>${r.sessions}</td>
                <td>
                  <div class="progress-track"><div class="progress-fill ${r.pct>100?'over':''}" style="width:${Math.min(r.pct,100)}%;"></div></div>
                  <div style="font-size:11.5px;color:#8a97a3;margin-top:2px;">${r.pct}%</div>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

        <div class="stat-grid">

        ${matches.length ? `
          <div class="table-wrap">

              <thead><tr><th>วันที่</th><th>เวลา</th><th>ชม.</th><th>ประเภท</th><th>สถานที่</th><th>วิทยากร</th></tr></thead>
              <tbody>
                ${matches.map(e=>`
                  <tr>

// PANEL: ปฏิทินรายเดือน
// ============================================================
function renderCalendarPanel(el){
  const yearCE = calYear - 543;
  const nDays = daysInMonth(yearCE, calMonth);
  const firstDow = new Date(yearCE, calMonth-1, 1).getDay();

  if(!calFrom || !calTo){
    calFrom = yearCE + '-' + pad2(calMonth) + '-01';
    calTo = yearCE + '-' + pad2(calMonth) + '-' + pad2(nDays);
  }

  const monthEntries = ENTRIES.filter(e=>{
    if(!e.date) return false;
    const d = parseYMD(e.date);
    return d.getFullYear()===yearCE && (d.getMonth()+1)===calMonth;
  });
  // คาบที่อยู่ในช่วงวันที่ที่เลือก (ใช้กับสถิติและสรุปวิชา)
  const rangeEntries = ENTRIES.filter(e=>{
    if(!e.date) return false;
    if(calFrom && e.date < calFrom) return false;
    if(calTo && e.date > calTo) return false;
    return true;
  });
  const totalSessions = rangeEntries.length;
  const totalHours = rangeEntries.reduce((s,e)=>s+e.hours,0);
  const theoryHours = rangeEntries.filter(e=>e.type==='ทฤษฎี').reduce((s,e)=>s+e.hours,0);
  const practiceHours = rangeEntries.filter(e=>e.type==='ปฏิบัติ').reduce((s,e)=>s+e.hours,0);
  const discussionHours = rangeEntries.filter(e=>e.type==='อภิปราย').reduce((s,e)=>s+e.hours,0);

  let cells = '';
  for(let i=0;i<firstDow;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let day=1; day<=nDays; day++){
    const ymd = yearCE + '-' + pad2(calMonth) + '-' + pad2(day);
    const daySessions = monthEntries.filter(e=>e.date===ymd);
    const dTheory = daySessions.filter(e=>e.type==='ทฤษฎี').reduce((s,e)=>s+e.hours,0);
    const dPractice = daySessions.filter(e=>e.type==='ปฏิบัติ').reduce((s,e)=>s+e.hours,0);
    const dDiscussion = daySessions.filter(e=>e.type==='อภิปราย').reduce((s,e)=>s+e.hours,0);
    cells += `
      <div class="cal-cell">
        <div class="d">${day}</div>
        ${daySessions.length ? `
          <div class="hrs">ท <b>${fmtHours(dTheory)}</b> ชม.</div>
          <div class="hrs">ป <b>${fmtHours(dPractice)}</b> ชม.</div>
          ${dDiscussion>0 ? `<div class="hrs">อ <b>${fmtHours(dDiscussion)}</b> ชม.</div>` : ''}
          <div class="hrs">${daySessions.length} คาบ</div>
        ` : ''}
      </div>
    `;
  }

  el.innerHTML = `
    <div class="card">
      <h2>🗓️ ปฏิทินรายเดือน</h2>
      <p class="sub">ภาพรวมจำนวนคาบและชั่วโมง (แยกทฤษฎี/ปฏิบัติ/อภิปราย) ในแต่ละวันของเดือนที่เลือก และสรุปชั่วโมงตามวิชาในช่วงวันที่ที่กำหนด</p>
      <div class="month-nav">
        <select id="cal_month">
          ${THAI_MONTHS.map((m,i)=>`<option value="${i+1}" ${calMonth===i+1?'selected':''}>${m}</option>`).join('')}
        </select>
        <input type="number" id="cal_year" min="2500" max="2650" value="${calYear}" style="width:100px;">
        <button class="btn btn-primary btn-sm" onclick="applyCalSettings()">แสดง</button>
      </div>
      <div class="month-nav" style="margin-top:0;align-items:flex-end;">
        <div class="field" style="min-width:180px;margin:0;">
          <label>จากวันที่</label>
          <input type="date" id="cal_from" value="${calFrom}" onchange="applyCalRange()">
        </div>
        <div class="field" style="min-width:180px;margin:0;">
          <label>ถึงวันที่</label>
          <input type="date" id="cal_to" value="${calTo}" onchange="applyCalRange()">
        </div>
      </div>
      <div class="stat-grid">
        <div class="stat-box"><div class="n">${totalSessions}</div><div class="l">คาบรวมในช่วงที่เลือก</div></div>
        <div class="stat-box"><div class="n">${fmtHours(totalHours)}</div><div class="l">ชั่วโมงรวม</div></div>
        <div class="stat-box"><div class="n">${fmtHours(theoryHours)}</div><div class="l">ชั่วโมงทฤษฎี</div></div>
        <div class="stat-box"><div class="n">${fmtHours(practiceHours)}</div><div class="l">ชั่วโมงปฏิบัติ</div></div>
        <div class="stat-box"><div class="n">${fmtHours(discussionHours)}</div><div class="l">ชั่วโมงอภิปราย</div></div>
      </div>
      <div class="cal-grid">
        ${THAI_DAYS.map(d=>`<div class="cal-head">${d}</div>`).join('')}
        ${cells}
      </div>
      ${buildRangeSubjectHtml(rangeEntries)}
    </div>
  `;
}

function buildRangeSubjectHtml(rangeEntries){
  const bySubject = {};
  rangeEntries.forEach(e=>{
    const key = e.subjectCode || e.subjectName;
    if(!bySubject[key]) bySubject[key] = { code:e.subjectCode, name:e.subjectName, theory:0, practice:0, discussion:0, count:0 };
    const rec = bySubject[key];
    if(e.type==='ทฤษฎี') rec.theory += e.hours;
    else if(e.type==='ปฏิบัติ') rec.practice += e.hours;
    else rec.discussion += e.hours;
    rec.count++;
  });
  const rows = Object.values(bySubject).sort((a,b)=>{
    const diff = (b.theory+b.practice+b.discussion) - (a.theory+a.practice+a.discussion);
    return diff || (a.name||'').localeCompare(b.name||'','th');
  });
  if(rows.length === 0){
    return `<div class="empty-state"><span class="glyph">📚</span>ไม่พบวิชาที่สอนในระหว่างวันที่ ${escapeHtml(thaiDateShort(calFrom))} – ${escapeHtml(thaiDateShort(calTo))}</div>`;
  }
  const gT = rows.reduce((s,r)=>s+r.theory,0);
  const gP = rows.reduce((s,r)=>s+r.practice,0);
  const gD = rows.reduce((s,r)=>s+r.discussion,0);
  const gC = rows.reduce((s,r)=>s+r.count,0);
  return `
    <h3 style="margin:22px 0 4px;color:var(--navy-deep);font-size:17px;">📚 สรุปวิชาที่สอน ระหว่างวันที่ ${escapeHtml(thaiDateShort(calFrom))} – ${escapeHtml(thaiDateShort(calTo))}</h3>
    <p class="sub">ชั่วโมงแยกตามวิชา (ทฤษฎี / ปฏิบัติ / อภิปราย) เฉพาะคาบที่อยู่ในช่วงวันที่ที่เลือก เรียงตามชั่วโมงรวมจากมากไปน้อย</p>
    <div class="table-wrap">
      <table class="data-table">
        <thead><tr>
          <th>รหัสวิชา</th><th>ชื่อวิชา</th><th>ทฤษฎี (ชม.)</th><th>ปฏิบัติ (ชม.)</th><th>อภิปราย (ชม.)</th><th>รวม (ชม.)</th><th>ครั้ง</th>
        </tr></thead>
        <tbody>
          ${rows.map(r=>`
            <tr>
              <td>${r.code ? escapeHtml(r.code) : '-'}</td>
              <td>${escapeHtml(r.name)}${r.code ? '' : '<br><span style="color:#b3432b;font-size:12px;font-weight:600;">⚠️ ไม่พบในหลักสูตร</span>'}</td>
              <td>${fmtHours(r.theory)}</td>
              <td>${fmtHours(r.practice)}</td>
              <td>${fmtHours(r.discussion)}</td>
              <td><b>${fmtHours(r.theory+r.practice+r.discussion)}</b></td>
              <td>${r.count}</td>
            </tr>
          `).join('')}
          <tr style="background:#f2f6fa;font-weight:700;">
            <td colspan="2">รวม</td>
            <td>${fmtHours(gT)}</td>
            <td>${fmtHours(gP)}</td>
            <td>${fmtHours(gD)}</td>
            <td>${fmtHours(gT+gP+gD)}</td>
            <td>${gC}</td>
          </tr>
        </tbody>
      </table>
    </div>
  `;
}

function applyCalSettings(){
  calMonth = Number(document.getElementById('cal_month').value);
  calYear = clampYear(Number(document.getElementById('cal_year').value));
  // เมื่อเปลี่ยนเดือน/ปี ให้ช่วงวันที่กลับเป็นทั้งเดือนนั้นใหม่
  const yearCE = calYear - 543;
  calFrom = yearCE + '-' + pad2(calMonth) + '-01';
  calTo = yearCE + '-' + pad2(calMonth) + '-' + pad2(daysInMonth(yearCE, calMonth));
  renderApp();
}
function applyCalRange(){
  const f = document.getElementById('cal_from').value;
  const t = document.getElementById('cal_to').value;
  if(f && t && f > t){
    alert('วันที่เริ่มต้องไม่ช้ากว่าวันที่สิ้นสุด');
    renderApp(); // คืนค่าเดิม (ยังไม่บันทึกช่วงใหม่)
    return;
  }
  calFrom = f;
  calTo = t;
  renderApp();
}

function readSubjectForm(){
  return {
    code: normalizeSpace(document.getElementById('m_code').value),
    name: normalizeSpace(document.getElementById('m_name').value),
    cat: normalizeSpace(document.getElementById('m_cat').value) || 'อื่นๆ',
    theory: Math.max(0, Number(document.getElementById('m_theory').value)||0),
    practice: Math.max(0, Number(document.getElementById('m_prac').value)||0),
    discussion: Math.max(0, Number(document.getElementById('m_disc').value)||0),
    extra: document.getElementById('m_extra').checked,
  };
}
function addSubjectToCur(){
  if(curProfile().locked){ alert('หลักสูตรมาตรฐานถูกล็อกไว้ — ไม่สามารถเพิ่มวิชาได้'); return; }
  const s = readSubjectForm();
  if(!s.code || !s.name){ alert('กรุณากรอกรหัสวิชาและชื่อวิชา'); return; }
  const cur = curProfile();
  if(cur.subjects.some(x=>x.code===s.code)){ alert('รหัสวิชานี้มีอยู่แล้วในหลักสูตร'); return; }
  if(cur.subjects.some(x=>x.name===s.name)){ alert('ชื่อวิชานี้มีอยู่แล้วในหลักสูตร'); return; }
  cur.subjects.push(s);
  saveCur().then(()=>renderApp());
}
function startEditSubject(code){
  const cur = curProfile();
  if(cur.locked){ alert('หลักสูตรมาตรฐานถูกล็อกไว้ — ไม่สามารถแก้ไขวิชาได้'); return; }
  if(!cur.subjects.some(x=>x.code===code)) return;
  manageEditCode = code;
  renderApp();
  window.scrollTo({top:0, behavior:'smooth'});
}
function cancelSubjectEdit(){ manageEditCode = null; renderApp(); }
function saveSubjectEdit(){
  if(curProfile().locked){ alert('หลักสูตรมาตรฐานถูกล็อกไว้ — ไม่สามารถแก้ไขวิชาได้'); return; }
  const s = readSubjectForm();
  const cur = curProfile();
  const idx = cur.subjects.findIndex(x=>x.code===manageEditCode);
  if(idx < 0) return;
  if(cur.subjects.some((x,i)=>i!==idx && x.name===s.name)){ alert('ชื่อวิชานี้มีอยู่แล้วในหลักสูตร'); return; }
  cur.subjects[idx] = { ...cur.subjects[idx], name:s.name, cat:s.cat, theory:s.theory, practice:s.practice, discussion:s.discussion, extra:s.extra };
  manageEditCode = null;
  saveCur().then(()=>renderApp());
}
async function deleteSubjectFromCur(code){
  const cur = curProfile();
  if(cur.locked){ alert('หลักสูตรมาตรฐานถูกล็อกไว้ — ไม่สามารถลบวิชาได้'); return; }
  const s = cur.subjects.find(x=>x.code===code);
  if(!s) return;
  if(!confirm(`ลบวิชา "${s.name}" ออกจากหลักสูตรหรือไม่?\n\nคาบที่บันทึกไว้แล้วของวิชานี้จะยังอยู่ แต่จะแสดงเป็น "ไม่พบในหลักสูตร"`)) return;
  cur.subjects = cur.subjects.filter(x=>x.code!==code);
  if(manageEditCode===code) manageEditCode = null;
  await saveCur();
  renderApp();
}
async function switchCurriculum(id){
  if(id === activeCurId){ renderApp(); return; }
  manageEditCode = null;
  const target = CURRICULA.find(c=>c.id===id);
  if(!target) return;
  if(!confirm(`สลับไปใช้ "${target.name}" หรือไม่?\n\nข้อมูลคาบเรียนของแต่ละหลักสูตรถูกแยกเก็บกัน — เมื่อสลับ ระบบจะแสดงเฉพาะคาบของ "${target.name}"`)) return;
  const prev = CURRICULA.find(c=>c.id===activeCurId);
  if(prev) prev.header2 = SETTINGS.orgLine2; // จำ "บรรทัดที่ 2" ของหลักสูตรเดิมไว้ (ไม่หายเมื่อสลับไปมา)
  activeCurId = id;
  SETTINGS.activeCurId = id;
  SETTINGS.orgLine2 = target.header2 || target.printHeader2 || SETTINGS.orgLine2;
  SETTINGS.orgLine3 = target.header3 || target.printHeader3 || SETTINGS.orgLine3;
  await saveSettings();
  try{
    const raw = await storageGetRaw(entriesKey());
    ENTRIES = raw ? JSON.parse(raw) : [];
  }catch(e){ ENTRIES = []; }
  await seedDefaultEntriesIfEmpty();
  recomputeCurriculum();
  renderApp();
}
async function renameCurriculum(){
  // เปลี่ยนชื่อหลักสูตรที่เลือกอยู่ในช่องสลับหลักสูตร (ไม่จำเป็นต้องสลับมาใช้ก่อน)
  const sel = document.getElementById('m_cur_sel');
  const id = (sel && sel.value) ? sel.value : activeCurId;
  const cur = CURRICULA.find(c=>c.id===id) || curProfile();
  if(cur.locked){ alert('หลักสูตรมาตรฐานถูกล็อกไว้ — ไม่สามารถเปลี่ยนชื่อได้'); return; }
  const newName = prompt('ชื่อหลักสูตรใหม่ (ชื่อนี้แสดงในแถบด้านบนและรายการสลับหลักสูตร):', cur.name);
  if(newName === null) return; // กดยกเลิก
  const nm = normalizeSpace(newName);
  if(!nm){ alert('กรุณากรอกชื่อหลักสูตร'); return; }
  if(CURRICULA.some(c=>c.id!==cur.id && c.name===nm)){
    if(!confirm(`มีหลักสูตรชื่อ "${nm}" อยู่แล้ว — เปลี่ยนชื่อซ้ำหรือไม่?`)) return;
  }
  cur.name = nm;
  await saveSettings();
  renderApp();
  alert(`เปลี่ยนชื่อหลักสูตรเป็น "${nm}" แล้ว`);
}
async function createCurriculum(){
  const name = prompt('ชื่อหลักสูตรใหม่ (เช่น หลักสูตรนายสิบตำรวจชั้นประทวน 2568):');
  if(name === null) return; // กดยกเลิก
  if(!normalizeSpace(name)){ alert('กรุณากรอกชื่อหลักสูตร'); return; }
  const newId = 'cur' + Date.now().toString(36);
  const newProf = { id:newId, name:normalizeSpace(name), printHeader2:'', header2:'', printHeader3:'', header3:'', locked:false, subjects:[] };
  CURRICULA.push(newProf);
  // สลับไปใช้หลักสูตรใหม่ทันที (ข้อมูลคาบยังว่าง)
  activeCurId = newId;
  SETTINGS.activeCurId = newId;
  SETTINGS.orgLine2 = '';
  SETTINGS.orgLine3 = '';
  manageEditCode = null;
  await saveSettings();
  try{
    const raw = await storageGetRaw(entriesKey());
    ENTRIES = raw ? JSON.parse(raw) : [];
  }catch(e){ ENTRIES = []; }
  recomputeCurriculum();
  renderApp();
  alert(`สร้างหลักสูตร "${newProf.name}" แล้ว — ระบบสลับมาให้แล้ว เพิ่มวิชาได้จากฟอร์มด้านบน`);
}
function exportCurriculum(){
  const cur = curProfile();
  const payload = { format:'nst-curriculum', version:1, exportedAt:new Date().toISOString(), curriculum: cur };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'หลักสูตร-' + (cur.name||'no-name').replace(/\s+/g,'-') + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function importCurriculum(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    try{
      const data = JSON.parse(ev.target.result);
      let prof = null;
      if(data && data.format==='nst-curriculum' && data.curriculum && Array.isArray(data.curriculum.subjects)){
        prof = data.curriculum;
      } else if(data && Array.isArray(data.subjects)){
        prof = { id:data.id||'', name:data.name||'', printHeader2:data.printHeader2||'', subjects:data.subjects };
      } else {
        throw new Error('รูปแบบไฟล์ไม่ใช่ไฟล์หลักสูตร');
      }
      if(!Array.isArray(prof.subjects) || prof.subjects.length===0) throw new Error('ไฟล์นี้ไม่มีรายวิชา');
      const baseId = String(prof.id||'cur').replace(/[^a-z0-9_-]/gi,'').slice(0,30) || 'cur';
      let newId = baseId, n = 2;
      while(CURRICULA.some(c=>c.id===newId)){ newId = baseId + '-' + (n++); }
      const newProf = {
        id: newId,
        name: normalizeSpace(prof.name) || ('หลักสูตรที่นำเข้า ' + newId),
        printHeader2: normalizeSpace(prof.printHeader2) || '',
        header2: normalizeSpace(prof.header2) || normalizeSpace(prof.printHeader2) || '',
        printHeader3: normalizeSpace(prof.printHeader3) || '',
        header3: normalizeSpace(prof.header3) || normalizeSpace(prof.printHeader3) || '',
        locked: !!prof.locked,
        subjects: prof.subjects.map(s=>({
          code: normalizeSpace(s.code) || ('รหัส-' + Math.random().toString(36).slice(2,6)),
          name: normalizeSpace(s.name) || 'ไม่ระบุชื่อ',
          cat: normalizeSpace(s.cat) || 'อื่นๆ',
          theory: Math.max(0, Number(s.theory)||0),
          practice: Math.max(0, Number(s.practice)||0),
          discussion: Math.max(0, Number(s.discussion)||0),
          extra: !!s.extra,
        })).filter(s=>s.name)
      };
      CURRICULA.push(newProf);
      await saveSettings();
      alert(`นำเข้าหลักสูตร "${newProf.name}" สำเร็จ (${newProf.subjects.length} วิชา)\n\nไปที่ช่อง "สลับหลักสูตร" เพื่อเลือกใช้`);
      renderApp();
    }catch(err){
      alert('ไม่สามารถอ่านไฟล์หลักสูตรนี้ได้: ' + err.message);
    }
  };
  reader.readAsText(file);
}
async function restoreDefaultCurriculum(){
  if(CURRICULA.some(c=>c.id==='nst2567')){ alert('หลักสูตรเริ่มต้น นสต.2567 มีอยู่แล้ว'); return; }
  const def = DEFAULT_CURRICULA[0];
  CURRICULA.unshift({ id:def.id, name:def.name, locked:true, printHeader2:def.printHeader2, header2:def.header2||def.printHeader2, printHeader3:def.printHeader3, header3:def.header3||def.printHeader3, subjects:def.subjects.map(s=>({...s})) });
  await saveSettings();
  renderApp();
}

async function init(){
  document.getElementById('root').innerHTML = `<div style="padding:60px;text-align:center;color:#5b6b7a;">กำลังโหลดข้อมูล...</div>`;
  await loadAll();
  renderApp();
}
init();
